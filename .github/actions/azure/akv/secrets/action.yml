name: Fetch Secrets from Azure Key Vault
description: Fetch secrets from Azure Key Vault and set them as environment variables
inputs:
  keyvault_name:
    required: true
    description: "Name of the Azure Key Vault"
  secret_names:
    required: true
    description: "Comma-separated list of secret names to fetch from the Key Vault"
outputs:
  msi_id:
    description: "Fetched secrets as environment variables"
runs:
  using: "composite"
  steps:
    
    - name: Fetch Secrets from Key Vault
      shell: bash
      run: |
        set -euo pipefail

        keyvault_name="${{ inputs.keyvault_name }}"
        secret_names="${{ inputs.secret_names }}"

        # Split the comma-separated secret names into an array
        IFS=',' read -ra secrets <<< "$secret_names"

        # Fetch each secret and set it as an environment variable
        for secret in "${secrets[@]}"; do
          secret_value=$(az keyvault secret show --name "$secret" --vault-name "$keyvault_name" --query "value" -o tsv)
          echo "Setting environment variable for secret: $secret"
          echo "$secret=$secret_value" >> $GITHUB_ENV
        done