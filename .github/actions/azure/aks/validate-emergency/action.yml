name: Validate emergency deployment request
description: Validate an emergency production deployment request and record its incident ID
inputs:
  incident_id:
    description: Incident or emergency change record ID
    required: true
  emergency_action:
    description: Emergency action selected in the workflow
    required: true
  image_reference:
    description: Production ACR image pinned by SHA-256 digest; required only for rollback
    required: false
  dispatch_ref:
    description: Git ref selected for workflow_dispatch
    required: true
runs:
  using: composite
  steps:
    - name: Validate request
      shell: bash
      env:
        INCIDENT_ID: ${{ inputs.incident_id }}
        EMERGENCY_ACTION: ${{ inputs.emergency_action }}
        IMAGE_REFERENCE: ${{ inputs.image_reference }}
        DISPATCH_REF: ${{ inputs.dispatch_ref }}
      run: |
        set -euo pipefail
        if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
          echo "Emergency deployments must be dispatched from main." >&2
          exit 1
        fi
        if [[ ! "$INCIDENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$ ]]; then
          echo "incident_id must be a non-empty incident/change reference using letters, numbers, '.', '_', '/', or '-'." >&2
          exit 1
        fi
        case "$EMERGENCY_ACTION" in
          rollback)
            if [[ ! "$IMAGE_REFERENCE" =~ ^[a-z0-9][a-z0-9.-]*\.azurecr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]; then
              echo "Rollback requires a production ACR image pinned to a lowercase SHA-256 digest." >&2
              exit 1
            fi
            ;;
          build_fix)
            if [[ -n "$IMAGE_REFERENCE" ]]; then
              echo "Do not provide image_reference for build_fix; CI will build and scan the image." >&2
              exit 1
            fi
            ;;
          *)
            echo "emergency_action must be 'rollback' or 'build_fix'." >&2
            exit 1
            ;;
        esac

        {
          printf '## Emergency production deployment request\n\n'
          printf -- '- Incident/change ID: `%s`\n' "$INCIDENT_ID"
          printf -- '- Action: `%s`\n' "$EMERGENCY_ACTION"
          printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
          printf -- '- Target environment: `prod`\n'
          if [[ "$EMERGENCY_ACTION" == "rollback" ]]; then
            printf -- '- Image: existing production ACR digest supplied for rollback\n'
          else
            printf -- '- Image: built and scanned from the selected `main` commit by Maven CI\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
