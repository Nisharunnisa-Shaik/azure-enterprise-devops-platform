name: Promote immutable image between ACRs
description: Import an image by digest into a destination ACR and verify digest preservation
inputs:
  source_image_reference:
    description: Source ACR image pinned by SHA-256 digest
    required: true
  source_acr_login_server:
    description: Configured source ACR login server
    required: true
  source_acr_resource_id:
    description: Azure resource ID of the source ACR
    required: true
  target_acr_name:
    description: Destination ACR resource name
    required: true
  target_acr_login_server:
    description: Destination ACR login server
    required: true
  target_acr_subscription:
    description: Subscription containing the destination ACR
    required: true
outputs:
  image_reference:
    description: Destination ACR image reference pinned by the verified digest
    value: ${{ steps.import_image.outputs.image_reference }}
  image_digest:
    description: Verified destination image digest
    value: ${{ steps.import_image.outputs.image_digest }}
runs:
  using: composite
  steps:
    - name: Import and verify image digest
      id: import_image
      shell: bash
      env:
        SOURCE_IMAGE_REFERENCE: ${{ inputs.source_image_reference }}
        SOURCE_ACR_LOGIN_SERVER: ${{ inputs.source_acr_login_server }}
        SOURCE_ACR_RESOURCE_ID: ${{ inputs.source_acr_resource_id }}
        TARGET_ACR_NAME: ${{ inputs.target_acr_name }}
        TARGET_ACR_LOGIN_SERVER: ${{ inputs.target_acr_login_server }}
        TARGET_ACR_SUBSCRIPTION: ${{ inputs.target_acr_subscription }}
      run: |
        set -euo pipefail

        if [[ ! "$SOURCE_IMAGE_REFERENCE" =~ @sha256:[0-9a-f]{64}$ ]]; then
          echo "source_image_reference must be pinned by a lowercase SHA-256 digest." >&2
          exit 1
        fi
        if [[ "$SOURCE_IMAGE_REFERENCE" != "$SOURCE_ACR_LOGIN_SERVER/"* ]]; then
          echo "source_image_reference must use the configured source ACR." >&2
          exit 1
        fi
        if [[ "$TARGET_ACR_LOGIN_SERVER" != "$TARGET_ACR_NAME.azurecr.io" ]]; then
          echo "target_acr_login_server must match target_acr_name.azurecr.io." >&2
          exit 1
        fi

        source_image="${SOURCE_IMAGE_REFERENCE#"$SOURCE_ACR_LOGIN_SERVER/"}"
        repository="${source_image%@sha256:*}"
        digest="${source_image##*@}"
        if [[ -z "$repository" || "$repository" == "$source_image" ]]; then
          echo "source_image_reference must include an image repository and digest." >&2
          exit 1
        fi
        if [[ "$repository" == *:* ]]; then
          echo "source_image_reference must use repository@digest without a tag." >&2
          exit 1
        fi

        source_registry_image="${repository}@${digest}"

        az acr import \
          --name "$TARGET_ACR_NAME" \
          --subscription "$TARGET_ACR_SUBSCRIPTION" \
          --registry "$SOURCE_ACR_RESOURCE_ID" \
          --source "$source_registry_image" \
          --repository "$repository" \
          --output none

        imported_digest=$(az acr repository show \
          --name "$TARGET_ACR_NAME" \
          --subscription "$TARGET_ACR_SUBSCRIPTION" \
          --image "$repository@$digest" \
          --query digest \
          --output tsv)
        if [[ "$imported_digest" != "$digest" ]]; then
          echo "Imported digest '$imported_digest' does not match source digest '$digest'." >&2
          exit 1
        fi

        echo "image_digest=$imported_digest" >> "$GITHUB_OUTPUT"
        echo "image_reference=$TARGET_ACR_LOGIN_SERVER/$repository@$imported_digest" >> "$GITHUB_OUTPUT"
