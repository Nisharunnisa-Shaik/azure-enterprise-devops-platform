name: Workflow for AKS Deployment
on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      branch_name:
        required: true
        type: string
      environment_name:
        description: GitHub Environment name for deployment protection and config selection
        required: true
        type: string
      deployment_config_file:
        description: YAML deployment configuration path in the checked-out application repository
        required: false
        type: string
        default: configuration/maven-config.yaml
      image_reference:
        description: Immutable ACR image reference to deploy (registry/repository@sha256:digest)
        required: false
        type: string
      require_image_registry_match:
        description: Require image_reference to use the selected environment's ACR login server from the config file
        required: false
        type: boolean
        default: false
      require_smoke_test:
        description: Require the selected environment's smoke-test URL from the config file and roll back if it fails
        required: false
        type: boolean
        default: false
  jobs:
    aks_deploy:
      environment: ${{ inputs.environment_name }}
      runs-on: selfhosted-ubuntu
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          with:
            repository: ${{ inputs.repo_name }}
            ref: ${{ inputs.branch_name }}

        - name: Load deployment configuration
          id: deployment_config
          uses: Nisharunnisa-Shaik/azure-enterprise-devops-platform/.github/actions/config/load-environment@main
          with:
            config_file: ${{ inputs.deployment_config_file }}
            environment_name: ${{ inputs.environment_name }}
            image_reference: ${{ inputs.image_reference }}
            require_image_registry_match: ${{ inputs.require_image_registry_match }}
            require_smoke_test: ${{ inputs.require_smoke_test }}

        - name: Login to Azure
          uses: Nisharunnisa-Shaik/azure-enterprise-devops-platform/.github/actions/azure/login@main
          with:
            keyvault_name: ${{ steps.deployment_config.outputs.keyvault_name }}
            keyvault_subscription: ${{ steps.deployment_config.outputs.keyvault_subscription || steps.deployment_config.outputs.aks_subscription }}
            auth_method: ${{ steps.deployment_config.outputs.auth_method }}
            msi_id_secret_name: ${{ steps.deployment_config.outputs.msi_id_secret_name }}
            client_id_secret_name: ${{ steps.deployment_config.outputs.client_id_secret_name }}
            client_secret_secret_name: ${{ steps.deployment_config.outputs.client_secret_secret_name }}
            tenant_id_secret_name: ${{ steps.deployment_config.outputs.tenant_id_secret_name }}
            azure_subscription: ${{ steps.deployment_config.outputs.aks_subscription }}

        - name: Deploy to AKS
          uses: Nisharunnisa-Shaik/azure-enterprise-devops-platform/.github/actions/azure/aks/deploy@main
          with:
            aks_name: ${{ steps.deployment_config.outputs.aks_name }}
            aks_resource_group: ${{ steps.deployment_config.outputs.aks_resource_group }}
            aks_subscription: ${{ steps.deployment_config.outputs.aks_subscription }}
            aks_namespace: ${{ steps.deployment_config.outputs.aks_namespace }}
            kustomize_path: ${{ steps.deployment_config.outputs.kustomize_path }}
            image_reference: ${{ inputs.image_reference }}
            container_name: ${{ steps.deployment_config.outputs.container_name }}
            deployment_name: ${{ steps.deployment_config.outputs.deployment_name }}

        - name: Verify deployment with smoke test
          if: ${{ inputs.require_smoke_test }}
          uses: Nisharunnisa-Shaik/azure-enterprise-devops-platform/.github/actions/azure/aks/smoke-test@main
          with:
            environment_name: ${{ inputs.environment_name }}
            smoke_test_url: ${{ steps.deployment_config.outputs.smoke_test_url }}
            rollback_on_failure: true
            aks_namespace: ${{ steps.deployment_config.outputs.aks_namespace }}
            deployment_name: ${{ steps.deployment_config.outputs.deployment_name }}
            kubeconfig_path: ${{ runner.temp }}/aks-kubeconfig-${{ github.run_id }}

        - name: Clear Azure CLI session
          if: always()
          uses: Nisharunnisa-Shaik/azure-enterprise-devops-platform/.github/actions/azure/aks/cleanup@main
          with:
            kubeconfig_path: ${{ runner.temp }}/aks-kubeconfig-${{ github.run_id }}